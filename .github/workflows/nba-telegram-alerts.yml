name: NBA Telegram alerts

on:
  schedule:
    - cron: "5 10 * * *"
      timezone: "Europe/Moscow"
    - cron: "5 21 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto checks the schedule; test sends the configured short message"
        type: choice
        options:
          - auto
          - test
        default: auto
        required: true

permissions:
  contents: read

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NBA_ALERT_MODE: ${{ inputs.mode || 'auto' }}
      NBA_ALERT_SLOT: ${{ github.event_name == 'schedule' && github.event.schedule == '5 21 * * *' && 'evening' || 'day' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check NBA schedule and notify if needed
        run: python3 scripts/nba_daily_alert.py
